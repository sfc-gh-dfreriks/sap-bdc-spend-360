spec:
  containers:
  - name: spend360
    image: /sc360_app_provider/images/repo/spend_360:latest
    env:
      PORT: "8080"
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m
    readinessProbe:
      port: 8080
      path: /healthcheck
  endpoints:
  - name: spend360
    port: 8080
    public: true
serviceRoles:
- name: spend_360_role
  endpoints:
  - spend360
